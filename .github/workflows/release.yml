name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'package.json'

env:
  NODE_VERSION: 26.x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: ${{ github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Set env
        run: |
          tag=$(npm pkg get version | xargs)
          echo "tag=${tag}" >> "$GITHUB_ENV"
          echo "prerelease=$([ "${tag##*-*}" ] && echo false || echo true)" >> "$GITHUB_ENV"
          published=$(npm view "$(npm pkg get name | xargs)@${tag}" version 2>/dev/null || true)
          echo "should_release=$([ -z "$published" ] && echo true || echo false)" >> "$GITHUB_ENV"
      - name: Install dependencies
        if: ${{ env.should_release == 'true' }}
        run: |
          npm ci
      - name: Verify dependency signatures
        if: ${{ env.should_release == 'true' }}
        run: |
          npm audit signatures
      - name: Build
        if: ${{ env.should_release == 'true' }}
        run: |
          npm run build --if-present
      - name: Pack
        id: pack
        if: ${{ env.should_release == 'true' }}
        run: |
          {
            echo "packages<<EOF"
            npm pack --json
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Build Attestations
        if: ${{ env.should_release == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            **/*.tgz
      - name: Upload artifact
        if: ${{ env.should_release == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.tag }}
          path: |
            package.json
            *.tgz
    outputs:
      tag: ${{ env.tag }}
      prerelease: ${{ env.prerelease }}
      should_release: ${{ env.should_release }}

  release:
    name: Release
    needs: build
    if: ${{ needs.build.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ needs.build.outputs.tag }}
      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2 # zizmor: ignore[superfluous-actions] prefer maintained action over inline `gh release` script
        with:
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease }}
          tag_name: ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          files: |
            **/*.tgz
    outputs:
      tag: ${{ needs.build.outputs.tag }}
      prerelease: ${{ needs.build.outputs.prerelease }}
      should_release: ${{ needs.build.outputs.should_release }}

  publish:
    name: Publish
    needs: release
    if: ${{ needs.release.outputs.should_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm publish
      attestations: read # gh attestation verify
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # 8.0.1
        with:
          name: ${{ needs.release.outputs.tag }}
      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          count=$(find . -name '*.tgz' | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no .tgz artifact found"; exit 1; fi
          find . -name '*.tgz' -print -exec gh attestation verify {} --repo ${{ github.repository }} \;
      - name: npm publish (next)
        if: ${{ needs.release.outputs.prerelease == 'true' }}
        run: |
          count=$(find . -name '*.tgz' | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no .tgz artifact found"; exit 1; fi
          find . -name '*.tgz' -exec npm publish --tag next --provenance --access public {} \;
      - name: npm publish (latest)
        if: ${{ needs.release.outputs.prerelease == 'false' }}
        run: |
          count=$(find . -name '*.tgz' | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::no .tgz artifact found"; exit 1; fi
          find . -name '*.tgz' -exec npm publish --tag latest --provenance --access public {} \;
